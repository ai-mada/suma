apiVersion: v1
kind: Service
metadata:
  name: {{ include "suma.name" . }}
  labels:
    {{- include "suma.selector" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "suma.selector" . | nindent 4 }}
