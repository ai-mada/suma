image:
  repository: suma-control
  tag: "0.1.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

service:
  port: 4310

# Create this Secret independently; chart values never contain secret values.
setupSecret:
  name: suma-control-secrets
  key: setup-token

database:
  driver: sqlite
  # For oceanbase/postgres, the Secret key holds the complete driver DSN.
  existingSecret: suma-control-secrets
  dsnKey: database-dsn

# Reference only: never put the base64 master key in values.
# SQLite with an empty existingSecret persists its own key on the data volume.
# Shared databases default to database.existingSecret when existingSecret is empty.
ingressMasterKey:
  existingSecret: ""
  key: ingress-master-key

persistence:
  existingClaim: ""
  size: 10Gi
  storageClass: ""

allowedOrigins: ""
secureCookies: true

knowledge:
  url: ""
  existingSecret: ""
  tokenKey: knowledge-token

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi
