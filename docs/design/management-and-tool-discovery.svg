<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
 <title id="title">suma 独立管理与执行工具接入结构设计</title>
 <desc id="desc">项目、团队、模型、工具、计量计费和组织设置六个独立管理域，复用现有权限、目录与账本；执行工具通过授权节点的真实库存完成自动发现、核对登记与明确启用。</desc>
 <defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;fill:#293145}.title{font-size:32px;font-weight:700}.subtitle{font-size:16px;fill:#6e778b}.heading{font-size:21px;font-weight:700}.body{font-size:15px;fill:#566078}.small{font-size:13px;fill:#6e778b}.accent{fill:#645ac8}.tag{font-size:12px;fill:#645ac8}.line{stroke:#dbe0e9;stroke-width:1.5}.arrow{stroke:#8b84be;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b84be"/></marker></defs>
 <rect width="1440" height="1120" fill="#f7f8fb"/>
 <rect x="0" y="0" width="1440" height="86" fill="white"/><path d="M0 86H1440" class="line"/>
 <rect x="48" y="23" width="40" height="40" rx="12" fill="#645ac8"/><text x="60" y="53" fill="white" style="fill:white;font-size:31px;font-weight:700;font-style:italic">s</text><text x="102" y="52" class="heading">suma</text><text x="1260" y="49" class="small">管理中心设计 · 1.0.0</text>
 <text x="64" y="144" class="title">独立管理，统一协作</text><text x="64" y="178" class="subtitle">工作空间专注交付；管理中心按业务职责组织配置，保留准确来源与授权范围。</text>
 <g id="projects"><rect x="64" y="218" width="416" height="198" rx="12" fill="white" stroke="#e7eaf0"/><rect x="86" y="240" width="40" height="40" rx="10" fill="#eeecfa"/><path d="M96 251H104L108 255H117V269H96Z" fill="none" stroke="#645ac8" stroke-width="2"/><text x="142" y="267" class="heading">项目管理</text><text x="88" y="312" class="body">项目目录 · 项目信息 · 项目资源 · 授权</text><text x="88" y="343" class="small">每个项目保持独立上下文与执行范围</text><path d="M88 363H456" class="line"/><text x="88" y="390" class="tag">复用项目与授权数据，不复制配置</text></g>
 <g id="teams"><rect x="512" y="218" width="416" height="198" rx="12" fill="white" stroke="#e7eaf0"/><rect x="534" y="240" width="40" height="40" rx="10" fill="#eeecfa"/><circle cx="550" cy="253" r="5" fill="none" stroke="#645ac8" stroke-width="2"/><path d="M541 270C541 258 559 258 559 270M563 250C571 250 571 259 563 259M564 262C569 262 571 266 571 270" fill="none" stroke="#645ac8" stroke-width="2"/><text x="590" y="267" class="heading">团队管理</text><text x="536" y="312" class="body">组织团队 · 协作关系 · 团队职责</text><text x="536" y="343" class="small">组织成员与项目资源的身份各自清晰</text><path d="M536 363H904" class="line"/><text x="536" y="390" class="tag">团队关系不自动授予项目权限</text></g>
 <g id="models"><rect x="960" y="218" width="416" height="198" rx="12" fill="white" stroke="#e7eaf0"/><rect x="982" y="240" width="40" height="40" rx="10" fill="#eeecfa"/><path d="M995 248L1009 248L1015 260L1009 272H995L989 260Z" fill="none" stroke="#645ac8" stroke-width="2"/><circle cx="1002" cy="260" r="4" fill="#645ac8"/><text x="1038" y="267" class="heading">模型管理</text><text x="984" y="312" class="body">公开模型目录 · 部署修订 · 来源依据</text><text x="984" y="343" class="small">平台部署、工具模型与固定模型分别呈现</text><path d="M984 363H1352" class="line"/><text x="984" y="390" class="tag">密钥留在执行节点与 Go 宿主管理</text></g>
 <g id="tools"><rect x="64" y="440" width="416" height="198" rx="12" fill="white" stroke="#e7eaf0"/><rect x="86" y="462" width="40" height="40" rx="10" fill="#eeecfa"/><path d="M96 473L103 481L96 489M107 489H117" fill="none" stroke="#645ac8" stroke-width="2"/><text x="142" y="489" class="heading">工具管理</text><text x="88" y="534" class="body">自动发现 · 工具档案 · 节点与调度</text><text x="88" y="565" class="small">连接真实 Runner 库存，减少手工清单</text><path d="M88 585H456" class="line"/><text x="88" y="612" class="tag">探测、登记、启用、实际执行分别记录</text></g>
 <g id="billing"><rect x="512" y="440" width="416" height="198" rx="12" fill="white" stroke="#e7eaf0"/><rect x="534" y="462" width="40" height="40" rx="10" fill="#eeecfa"/><path d="M545 470H563V493L558 490L554 493L550 490L545 493ZM550 476H558M550 482H558" fill="none" stroke="#645ac8" stroke-width="2"/><text x="590" y="489" class="heading">计量计费</text><text x="536" y="534" class="body">实际用量 · 估算费率 · 额度 · 未知核对</text><text x="536" y="565" class="small">各币种分别管理，已知与未知不能混算</text><path d="M536 585H904" class="line"/><text x="536" y="612" class="tag">复用唯一账本，估算不等于供应商发票</text></g>
 <g id="organization"><rect x="960" y="440" width="416" height="198" rx="12" fill="white" stroke="#e7eaf0"/><rect x="982" y="462" width="40" height="40" rx="10" fill="#eeecfa"/><path d="M992 491V471H1012V491ZM997 477H1000M1005 477H1008M997 483H1000M1005 483H1008M1000 491V487H1005V491" fill="none" stroke="#645ac8" stroke-width="2"/><text x="1038" y="489" class="heading">组织设置</text><text x="984" y="534" class="body">账户与成员 · 语言 · 集成 · 接入令牌</text><text x="984" y="565" class="small">组织治理与项目配置保持明确边界</text><path d="M984 585H1352" class="line"/><text x="984" y="612" class="tag">当前授权校验覆盖每次读取与操作</text></g>
 <text x="64" y="703" class="heading">执行工具接入：优先自动发现，保留明确确认</text>
 <g id="onboarding"><rect x="64" y="733" width="1312" height="211" rx="12" fill="white" stroke="#e7eaf0"/>
  <g><rect x="88" y="759" width="224" height="112" rx="8" fill="#eeecfa"/><text x="108" y="790" class="tag">1 · 当前项目范围</text><text x="108" y="821" class="heading">选择授权节点</text><text x="108" y="847" class="small">私有节点／当前共享路由</text></g>
  <path d="M320 812H346" class="arrow"/>
  <g><rect x="356" y="759" width="224" height="112" rx="8" fill="#f7f8fb"/><text x="376" y="790" class="tag">2 · 只读真实上报</text><text x="376" y="821" class="heading">自动发现工具</text><text x="376" y="847" class="small">标明时间、可用性与异常</text></g>
  <path d="M588 812H614" class="arrow"/>
  <g><rect x="624" y="759" width="224" height="112" rx="8" fill="#f7f8fb"/><text x="644" y="790" class="tag">3 · 保留人工选择</text><text x="644" y="821" class="heading">核对并登记</text><text x="644" y="847" class="small">唯一可用项自动建议</text></g>
  <path d="M856 812H882" class="arrow"/>
  <g><rect x="892" y="759" width="224" height="112" rx="8" fill="#f7f8fb"/><text x="912" y="790" class="tag">4 · 配置默认暂停</text><text x="912" y="821" class="heading">明确核对启用</text><text x="912" y="847" class="small">派发时再次检查资格</text></g>
  <path d="M1124 812H1150" class="arrow"/>
  <g><rect x="1160" y="759" width="192" height="112" rx="8" fill="#eef8f4"/><text x="1180" y="790" class="small">真实执行与结果</text><text x="1180" y="821" class="heading">进入任务派发</text><text x="1180" y="847" class="small">独立测试与人工验收</text></g>
  <text x="88" y="915" class="body">异常恢复：未上报 → 检查节点　｜　已过期 → 等待新上报　｜　失授权 → 核对路由与凭据　｜　离线接入 → 文件／粘贴清单</text>
 </g>
 <text x="64" y="1000" class="heading">共同原则</text><text x="64" y="1034" class="body">一次配置来源 · 明确授权范围 · 原操作回执恢复 · 真实状态可追溯 · 不把配置成功等同于模型健康或交付验收</text>
 <text x="64" y="1081" class="small">此图描述目标结构；实现与验证以对应阶段报告为准。T-MGMT-131 / T-DISCOVERY-132</text>
</svg>
