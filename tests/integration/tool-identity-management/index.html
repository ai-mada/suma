<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool management · suma</title>
  <link rel="stylesheet" href="/fixture.css">
  <style>
    .identity-fixture { max-width: 1600px; margin: auto; padding: 24px; }
    .identity-fixture-header {
      display: flex; align-items: center; gap: 16px; min-height: 56px;
      margin-bottom: 20px; border-bottom: 1px solid var(--line);
    }
    .identity-fixture-header strong { font-size: 22px; color: var(--accent); }
    .identity-fixture-header h1 { margin: 0; font-size: 24px; }
    @media (max-width: 600px) {
      .identity-fixture { padding: 12px; }
      .identity-fixture-header { gap: 12px; margin-bottom: 12px; }
      .identity-fixture-header h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/fixture.js"></script>
</body>
</html>
